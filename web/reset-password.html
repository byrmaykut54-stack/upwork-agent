<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MexAy — Yeni Şifre</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070b16;color:#fff;font-family:Inter,system-ui}.box{width:min(420px,calc(100% - 36px));background:#101d42;border:1px solid #2b3b65;border-radius:18px;padding:24px;box-sizing:border-box}h1{margin:0 0 8px}.muted{color:#9ca8b8;font-size:13px}input,button{width:100%;height:50px;box-sizing:border-box;border-radius:12px;margin-top:12px}input{background:#080f20;border:1px solid #33456f;color:#fff;padding:0 14px}button{border:0;background:linear-gradient(135deg,#dffcff,#78e8ff);font-weight:800}a{color:#f5c451}.error{color:#ff8f9b;font-size:13px;min-height:20px}</style></head><body><main class="box"><h1>Yeni şifre oluştur</h1><p class="muted">MexAy hesabınız için yeni şifrenizi belirleyin.</p><input id="p1" type="password" minlength="8" placeholder="Yeni şifre"><input id="p2" type="password" minlength="8" placeholder="Yeni şifre tekrar"><button id="save">Şifreyi güncelle</button><p id="msg" class="error"></p><p><a href="/">Giriş ekranına dön</a></p></main><script>var token=new URLSearchParams(location.search).get('token')||'';document.getElementById('save').onclick=async function(){var a=document.getElementById('p1').value,b=document.getElementById('p2').value,m=document.getElementById('msg');if(a.length<8){m.textContent='Şifre en az 8 karakter olmalı.';return}if(a!==b){m.textContent='Şifreler eşleşmiyor.';return}try{var r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token,password:a})});var d=await r.json();if(!r.ok)throw Error(d.error||'İşlem başarısız');m.style.color='#51d99b';m.textContent='Şifreniz yenilendi. Giriş ekranına yönlendiriliyorsunuz.';setTimeout(function(){location.href='/'},1200)}catch(e){m.textContent=e.message}}</script></body></html>
