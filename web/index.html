<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MexAy</title><style>
:root{--n:#0F1B3D;--o:#FF6B35;--g:#F5C451;--w:#F7F8FC;--m:#AAB4C8;--p:#14234D;--l:#2B3B65}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#081126,#0F1B3D 55%,#111d40);color:var(--w);font-family:Inter,system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.card{background:#122149eF;border:1px solid var(--l);border-radius:18px;padding:22px}.login .card{width:min(430px,100%)}.brand{font-weight:800;font-size:30px;letter-spacing:-.05em}.brand .x{color:var(--o)}.brand .ay{color:var(--g)}.brand{text-align:center;margin-bottom:15px}.sub,.muted{color:var(--m)}.sub{text-align:center;font-size:13px}.field{margin:10px 0}.field input,.field textarea,.field select{width:100%;background:#091532;border:1px solid #354875;color:#fff;border-radius:11px;padding:12px}.primary{width:100%;border:0;border-radius:11px;padding:13px;background:linear-gradient(135deg,var(--o),var(--g));color:var(--n);font-weight:800}.link{background:none;border:0;color:var(--g);display:block;margin:14px auto}.error{color:#ff7185;text-align:center;min-height:18px;font-size:12px}.app{display:grid;grid-template-columns:225px 1fr;min-height:100vh}.side{background:#09132d;border-right:1px solid #ffffff12;padding:20px}.side .brand{text-align:left;font-size:25px;margin-bottom:25px}.nav{width:100%;text-align:left;padding:11px;margin:3px 0;background:none;border:1px solid transparent;border-radius:10px;color:var(--m)}.nav.active,.nav:hover{background:#ffffff09;color:#fff;border-color:#ffffff12}.main{padding:28px;max-width:1300px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.top h1{margin:0;font-size:30px}.btn{padding:9px 12px;border:1px solid var(--l);background:#ffffff08;color:#fff;border-radius:9px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.value{font-size:27px;font-weight:800;margin-top:6px}.section{margin-top:16px}.row{display:flex;justify-content:space-between;gap:15px;padding:15px 0;border-bottom:1px solid #ffffff10}.row:last-child{border:0}.score{color:var(--g);font-weight:800;font-size:20px}.tag{font-size:10px;border:1px solid #ffffff18;padding:4px 7px;border-radius:99px;color:var(--m)}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px}.modal>div{width:min(720px,100%);max-height:90vh;overflow:auto;background:#101d42;border:1px solid var(--l);border-radius:16px;padding:20px}.toast{position:fixed;right:18px;bottom:18px;background:#102044;border:1px solid #51d99b;padding:12px;border-radius:10px}@media(max-width:800px){.app{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid #ffffff12}.nav{width:48%;display:inline-block}.grid{grid-template-columns:repeat(2,1fr)}.main{padding:18px}}@media(max-width:500px){.grid{grid-template-columns:1fr}}
</style></head><body>
<section id="login" class="login"><form id="auth" class="card"><div class="brand">Me<span class="x">x</span><span class="ay">Ay</span></div><h2 id="at" style="text-align:center">Giriş Yap</h2><p class="sub">MexAy hesabınıza güvenli şekilde devam edin.</p><div class="field"><input id="email" type="email" placeholder="E-posta" required></div><div class="field"><input id="pass" type="password" placeholder="Şifre" minlength="8" required></div><button class="primary" id="ab">Giriş Yap</button><button type="button" class="link" id="sw">Hesabınız yok mu? Ücretsiz oluşturun</button><p id="ae" class="error"></p></form></section>
<section id="app" class="app hidden"><aside class="side"><div class="brand">Me<span class="x">x</span><span class="ay">Ay</span></div><button class="nav active" data-p="home">Genel Bakış</button><button class="nav" data-p="jobs">İşler</button><button class="nav" data-p="proposals">Teklifler</button><button class="nav" data-p="notifications">Bildirimler</button><button class="nav" data-p="settings">Ayarlar</button><button class="nav" id="logout">Çıkış Yap</button></aside><main class="main"><div class="top"><div><h1 id="title">Genel Bakış</h1><p id="sub" class="muted">Zamanı sen yönet, gerisi MexAy.</p></div><button class="btn" id="refresh">Yenile</button></div><div id="content"></div></main></section><div id="modal" class="modal hidden"><div><button class="btn" style="float:right" onclick="closeModal()">Kapat</button><h2 id="mt"></h2><div id="mb"></div></div></div><div id="toast" class="toast hidden"></div>
<script>
var mode='login',page='home',S={user:null,stats:null,jobs:[],proposals:[],notifications:[],settings:null};
function $(x){return document.getElementById(x)}function esc(x){return String(x||'').replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
async function api(u,o){o=o||{};o.headers=Object.assign({'Content-Type':'application/json'},o.headers||{});var r=await fetch(u,o),d={};try{d=await r.json()}catch(e){}if(!r.ok)throw Error(d.error||'İşlem başarısız');return d}
$('sw').onclick=function(){mode=mode==='login'?'register':'login';$('at').textContent=mode==='login'?'Giriş Yap':'Hesap Oluştur';$('ab').textContent=mode==='login'?'Giriş Yap':'Hesap Oluştur';$('sw').textContent=mode==='login'?'Hesabınız yok mu? Ücretsiz oluşturun':'Zaten hesabınız var mı? Giriş yapın'}
$('auth').onsubmit=async function(e){e.preventDefault();try{var d=await api('/api/auth/'+mode,{method:'POST',body:JSON.stringify({email:$('email').value,password:$('pass').value})});show(d.user)}catch(x){$('ae').textContent=x.message}}
async function show(u){S.user=u;$('login').classList.add('hidden');$('app').classList.remove('hidden');await load()}
async function load(){try{var a=await Promise.all([api('/api/dashboard'),api('/api/jobs'),api('/api/proposals'),api('/api/notifications'),api('/api/settings')]);S.stats=a[0].stats;S.user=a[0].user;S.jobs=a[1].jobs;S.proposals=a[2].proposals;S.notifications=a[3].notifications;S.settings=a[4].settings;render()}catch(e){toast(e.message)}}
$('logout').onclick=async function(){await api('/api/auth/logout',{method:'POST'});location.reload()};$('refresh').onclick=load;
document.querySelectorAll('.nav[data-p]').forEach(function(b){b.onclick=function(){page=b.dataset.p;document.querySelectorAll('.nav').forEach(function(x){x.classList.remove('active')});b.classList.add('active');render()}})
function render(){var m={home:['Genel Bakış','MexAy iş akışınızın merkezi.'],jobs:['İşler','İlanları analiz et, kaydet ve teklif hazırla.'],proposals:['Teklifler','Taslakları incele ve durumlarını takip et.'],notifications:['Bildirimler','MexAy bildirimleri.'],settings:['Ayarlar','İş eşleştirme kriterleri.']};$('title').textContent=m[page][0];$('sub').textContent=m[page][1];window[page]()}
function home(){$('content').innerHTML='<div class="grid"><div class="card"><span class="muted">Plan</span><div class="value">'+esc(S.user.plan)+'</div></div><div class="card"><span class="muted">Tarama</span><div class="value">'+S.user.scans_used+' / '+S.stats.scan_limit+'</div></div><div class="card"><span class="muted">Kayıtlı İş</span><div class="value">'+S.stats.saved+'</div></div><div class="card"><span class="muted">Teklif</span><div class="value">'+S.stats.proposals+'</div></div></div><div class="card section"><h3>Hızlı Başlangıç</h3><button class="btn" onclick="demo()">Demo İşleri Tara</button> <button class="btn" onclick="go('jobs')">İşleri Gör</button><p class="muted">MexAy ilanları analiz eder, uygunluk kontrolü yapar ve teklif taslağı oluşturur. Gerçek gönderim kullanıcı onayına bağlıdır.</p></div>'}
function go(p){page=p;document.querySelectorAll('.nav').forEach(function(x){x.classList.toggle('active',x.dataset.p===p)});render()}
function jobs(){var h='<div class="card"><button class="btn" onclick="demo()">Demo İşleri Tara</button> <button class="btn" onclick="imp()">JSON İçe Aktar</button>';if(!S.jobs.length)h+='<p class="muted">Henüz iş yok.</p>';S.jobs.forEach(function(j){h+='<div class="row"><div><b>'+esc(j.title)+'</b><p class="muted">'+esc((j.description||'').slice(0,200))+'</p><span class="tag">'+esc(j.status)+'</span></div><div style="text-align:right"><div class="score">'+(j.score||0)+'/100</div><button class="btn" onclick="save('+j.id+')">'+(j.status==='saved'?'Kaldır':'Kaydet')+'</button> <button class="btn" onclick="proposal('+j.id+')">Teklif</button></div></div>'});$('content').innerHTML=h+'</div>'}
function proposals(){var h='<div class="card">';if(!S.proposals.length)h+='<p class="muted">Henüz teklif taslağı yok.</p>';S.proposals.forEach(function(p){h+='<div class="row"><div><b>'+esc(p.title)+'</b><p class="muted">'+esc(p.body.slice(0,240))+'...</p></div><select onchange="pstatus('+p.id+',this.value)"><option '+(p.status==='draft'?'selected':'')+'>draft</option><option '+(p.status==='review'?'selected':'')+'>review</option><option '+(p.status==='approved'?'selected':'')+'>approved</option><option '+(p.status==='submitted'?'selected':'')+'>submitted</option><option '+(p.status==='replied'?'selected':'')+'>replied</option><option '+(p.status==='won'?'selected':'')+'>won</option><option '+(p.status==='lost'?'selected':'')+'>lost</option></select></div>});$('content').innerHTML=h+'</div>'}
function notifications(){var h='<div class="card"><button class="btn" onclick="readAll()">Tümünü okundu işaretle</button>';S.notifications.forEach(function(n){h+='<div class="row"><div><b>'+esc(n.title)+'</b><p class="muted">'+esc(n.body)+'</p></div></div>'});$('content').innerHTML=h+'</div>'}
function settings(){var s=S.settings;$('content').innerHTML='<div class="card"><div class="field"><label>Minimum saatlik ücret</label><input id="mh" value="'+s.min_hourly+'"></div><div class="field"><label>Minimum sabit bütçe</label><input id="mf" value="'+s.min_fixed+'"></div><div class="field"><label>Anahtar kelimeler</label><textarea id="kw">'+esc(s.keywords.join(','))+'</textarea></div><div class="field"><label>Hariç kelimeler</label><textarea id="ex">'+esc(s.excludes.join(','))+'</textarea></div><button class="primary" onclick="saveSettings()">Ayarları Kaydet</button></div>'}
async function demo(){try{await api('/api/scan',{method:'POST',body:JSON.stringify({connects_balance:10,jobs:[{id:'demo-1',title:'Google Sheets & AI Automation Dashboard',description:'Build an automation workflow with Google Sheets, APIs and AI.',skills:['Google Sheets','Automation','API','AI'],hourly_rate_max:35,payment_verified:true,proposals_count:8,client_hires:4,can_apply:true,connects_cost:5,url:''}]})});toast('Tarama tamamlandı');await load();go('jobs')}catch(e){toast(e.message)}}
async function save(id){try{await api('/api/jobs/'+id+'/save',{method:'POST'});await load()}catch(e){toast(e.message)}}async function proposal(id){try{var d=await api('/api/proposals',{method:'POST',body:JSON.stringify({job_id:id})});openModal('Teklif Taslağı','<pre style="white-space:pre-wrap">'+esc(d.body)+'</pre>');await load()}catch(e){toast(e.message)}}async function pstatus(id,s){try{await api('/api/proposals/'+id,{method:'PATCH',body:JSON.stringify({status:s})});await load()}catch(e){toast(e.message)}}async function readAll(){await api('/api/notifications/read',{method:'POST'});await load()}async function saveSettings(){try{await api('/api/settings',{method:'PUT',body:JSON.stringify({min_hourly:$('mh').value,min_fixed:$('mf').value,keywords:$('kw').value.split(',').map(function(x){return x.trim()}).filter(Boolean),excludes:$('ex').value.split(',').map(function(x){return x.trim()}).filter(Boolean)})});toast('Ayarlar kaydedildi');await load()}catch(e){toast(e.message)}}function imp(){openModal('JSON İçe Aktar','<textarea id="json" style="width:100%;height:220px">[]</textarea><br><button class="primary" onclick="doImp()">İçe Aktar</button>')}async function doImp(){try{await api('/api/jobs/import',{method:'POST',body:JSON.stringify({jobs:JSON.parse($('json').value)})});closeModal();await load();go('jobs')}catch(e){toast(e.message)}}function openModal(t,b){$('mt').textContent=t;$('mb').innerHTML=b;$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');setTimeout(function(){$('toast').classList.add('hidden')},2500)}
(async function(){try{var d=await api('/api/me');if(d.authenticated)show(d.user)}catch(e){}})();
</script></body></html>
