<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MexAy</title><style>
:root{--bg:#05070a;--panel:#0b0f15;--line:#202833;--text:#f5f7fb;--muted:#8791a1;--cyan:#76e7ff;--violet:#9a7cff;--gold:#F5C451;--orange:#FF6B35}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text)}
body{min-height:100vh;overflow-x:hidden}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden;background:radial-gradient(circle at 50% 22%,#76e7ff12,transparent 24%),radial-gradient(circle at 50% 58%,#9a7cff0f,transparent 35%),#05070a}
.login-shell{width:min(430px,100%);min-height:720px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8px;animation:rise .9s ease both}
.login-top{font-size:12px;font-weight:800;letter-spacing:.22em;color:#aeb7c5;text-transform:uppercase}
.visual{position:relative;width:100%;height:390px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.visual:after{content:"";position:absolute;width:310px;height:310px;border-radius:50%;background:radial-gradient(circle,#76e7ff14,#9a7cff08 38%,transparent 70%);filter:blur(12px);animation:pulse 3.8s ease-in-out infinite}
.lamp{position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;height:118px;z-index:4;animation:floatLamp 4s ease-in-out infinite}.cable{position:absolute;top:-20px;left:50%;width:2px;height:76px;background:#6b7481;transform:translateX(-50%)}
.lamp-body{position:absolute;left:50%;top:52px;transform:translateX(-50%);width:118px;height:64px;border-radius:62px 62px 18px 18px;background:linear-gradient(145deg,#dfe7ef,#727c89 65%,#3b424d);box-shadow:0 0 10px #fff8,0 0 35px #76e7ff6b,0 0 80px #76e7ff2e}.lamp-body:after{content:"";position:absolute;left:27px;right:27px;bottom:-7px;height:14px;border-radius:50%;background:#e9fbff;box-shadow:0 0 18px #cfffff,0 0 45px #76e7ffc9}
.beam{position:absolute;top:108px;left:50%;width:290px;height:250px;transform:translateX(-50%);background:linear-gradient(180deg,#cffbff2e,#76e7ff0d 42%,transparent 78%);clip-path:polygon(31% 0,69% 0,100% 100%,0 100%);filter:blur(4px);animation:flicker 4s ease-in-out infinite}
.robot{position:absolute;z-index:5;top:175px;width:146px;height:155px;animation:robotFloat 3.4s ease-in-out infinite;filter:drop-shadow(0 0 12px #76e7ff80) drop-shadow(0 16px 28px #9a7cff38)}
.head{position:absolute;left:21px;top:5px;width:104px;height:82px;border:2px solid #657080;border-radius:28px 28px 32px 32px;background:linear-gradient(145deg,#1c2530,#080b10);box-shadow:inset 0 1px 0 #fff2}.eye{position:absolute;top:31px;width:17px;height:17px;border-radius:50%;background:#a9f3ff;box-shadow:0 0 8px #76e7ff,0 0 22px #76e7ff}.eye.left{left:28px}.eye.right{right:28px}.mouth{position:absolute;left:39px;bottom:16px;width:27px;height:3px;border-radius:10px;background:#697685;box-shadow:0 0 8px #76e7ff}.ear{position:absolute;top:35px;width:14px;height:26px;border:2px solid #586372;border-radius:8px;background:#10161d}.ear.left{left:7px}.ear.right{right:7px}
.robot .body{position:absolute;left:35px;top:91px;width:76px;height:57px;border:2px solid #596575;border-radius:18px 18px 14px 14px;background:linear-gradient(145deg,#1a222c,#080b10)}.core{position:absolute;left:27px;top:16px;width:20px;height:20px;border-radius:50%;background:#bff8ff;box-shadow:0 0 10px #76e7ff,0 0 25px #76e7ff}.arm{position:absolute;top:102px;width:18px;height:48px;border:2px solid #4d5967;border-radius:12px;background:#10161d}.arm.left{left:18px;transform:rotate(12deg)}.arm.right{right:18px;transform:rotate(-12deg)}
.form{width:100%;animation:rise 1s .15s ease both}.form-title{text-align:center;font-size:24px;margin:0 0 6px}.form-sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 20px}.field{margin-bottom:10px}.field input{width:100%;height:52px;padding:0 16px;border:1px solid #29323e;border-radius:13px;background:#ffffff06;color:#fff;outline:none}.field input:focus{border-color:#76e7ff66;box-shadow:0 0 0 3px #76e7ff0d,0 0 22px #76e7ff0b}
.primary{width:100%;height:52px;border:1px solid #bdf6ff55;border-radius:13px;background:linear-gradient(135deg,#dffcff,#78e8ff);color:#061014;font-weight:850;box-shadow:0 0 25px #76e7ff2e}.switch{border:0;background:transparent;color:#9ca8b8;font-size:12px;margin:14px auto 0;display:block}.switch span{color:#cfffff}.error{min-height:20px;color:#ff8f9b;text-align:center;font-size:12px}.login-footer{font-size:11px;letter-spacing:.18em;text-align:center;color:#aeb7c5;text-transform:uppercase;padding-top:8px}.login-footer b{color:#fff}.login-footer .x{color:var(--orange)}.login-footer .ay{color:var(--gold)}.login-footer .dot{color:var(--gold);margin:0 9px}
.app{display:grid;grid-template-columns:225px 1fr;min-height:100vh;background:linear-gradient(145deg,#081126,#0F1B3D 55%,#111d40)}.side{background:#09132d;border-right:1px solid #ffffff12;padding:20px}.brand{font-weight:800;font-size:25px;letter-spacing:-.05em}.brand .x{color:var(--orange)}.brand .ay{color:var(--gold)}.side .brand{margin-bottom:25px}.nav{width:100%;text-align:left;padding:11px;margin:3px 0;background:none;border:1px solid transparent;border-radius:10px;color:var(--muted)}.nav.active,.nav:hover{background:#ffffff09;color:#fff;border-color:#ffffff12}.main{padding:28px;max-width:1300px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.top h1{margin:0;font-size:30px}.btn{padding:9px 12px;border:1px solid #2B3B65;background:#ffffff08;color:#fff;border-radius:9px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card{background:#122149eF;border:1px solid #2B3B65;border-radius:18px;padding:22px}.value{font-size:27px;font-weight:800;margin-top:6px}.section{margin-top:16px}.row{display:flex;justify-content:space-between;gap:15px;padding:15px 0;border-bottom:1px solid #ffffff10}.row:last-child{border:0}.score{color:var(--gold);font-weight:800;font-size:20px}.tag{font-size:10px;border:1px solid #ffffff18;padding:4px 7px;border-radius:99px;color:var(--muted)}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px}.modal>div{width:min(720px,100%);max-height:90vh;overflow:auto;background:#101d42;border:1px solid #2B3B65;border-radius:16px;padding:20px}.toast{position:fixed;right:18px;bottom:18px;background:#102044;border:1px solid #51d99b;padding:12px;border-radius:10px}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}@keyframes robotFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes floatLamp{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,3px)}}@keyframes pulse{0%,100%{opacity:.65;transform:scale(.98)}50%{opacity:1;transform:scale(1.04)}}@keyframes flicker{0%,100%{opacity:.72}45%{opacity:.9}48%{opacity:.68}52%{opacity:.88}}
@media(max-width:800px){.app{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid #ffffff12}.nav{width:48%;display:inline-block}.grid{grid-template-columns:repeat(2,1fr)}.main{padding:18px}}@media(max-width:500px){.grid{grid-template-columns:1fr}.visual{height:350px}.login-shell{min-height:690px}.login{padding:18px}}
</style></head><body>
<section id="login" class="login"><main class="login-shell">
<div class="login-top">MEXAY</div>
<section class="visual"><div class="lamp"><div class="cable"></div><div class="lamp-body"></div></div><div class="beam"></div><div class="robot"><div class="ear left"></div><div class="ear right"></div><div class="head"><i class="eye left"></i><i class="eye right"></i><i class="mouth"></i></div><div class="arm left"></div><div class="arm right"></div><div class="body"><i class="core"></i></div></div></section>
<form id="auth" class="form"><h1 id="at" class="form-title">Giriş Yap</h1><p class="form-sub">MexAy hesabınıza güvenli şekilde devam edin.</p><div class="field"><input id="email" type="email" autocomplete="email" placeholder="E-posta adresi" required></div><div class="field"><input id="pass" type="password" autocomplete="current-password" placeholder="Şifre" minlength="8" required></div><button class="primary" id="ab" type="submit">Giriş Yap</button><button type="button" class="switch" id="sw">Hesabınız yok mu? <span>Ücretsiz oluşturun</span></button><p id="ae" class="error"></p></form>
<div class="login-footer"><b>Mex<span class="x">x</span><span class="ay">Ay</span></b><span class="dot">•</span>YÖNETİM PLATFORMU</div>
</main></section><div class="login-footer"><span class="subbrand">MexAy</span><span class="sep">•</span><span>YÖNETİM PLATFORMU</span></div>
<section id="app" class="app hidden"><aside class="side"><div class="brand">Me<span class="x">x</span><span class="ay">Ay</span></div><button class="nav active" data-p="home">Genel Bakış</button><button class="nav" data-p="jobs">İşler</button><button class="nav" data-p="proposals">Teklifler</button><button class="nav" data-p="notifications">Bildirimler</button><button class="nav" data-p="settings">Ayarlar</button><button class="nav" id="logout">Çıkış Yap</button></aside><main class="main"><div class="top"><div><h1 id="title">Genel Bakış</h1><p id="sub" class="muted">Zamanı sen yönet, gerisi MexAy.</p></div><button class="btn" id="refresh">Yenile</button></div><div id="content"></div></main></section><div id="modal" class="modal hidden"><div><button class="btn" style="float:right" onclick="closeModal()">Kapat</button><h2 id="mt"></h2><div id="mb"></div></div></div><div id="toast" class="toast hidden"></div>
<script>
var mode='login',page='home',S={user:null,stats:null,jobs:[],proposals:[],notifications:[],settings:null};
function $(x){return document.getElementById(x)}function esc(x){return String(x||'').replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
async function api(u,o){o=o||{};o.headers=Object.assign({'Content-Type':'application/json'},o.headers||{});var r=await fetch(u,o),d={};try{d=await r.json()}catch(e){}if(!r.ok)throw Error(d.error||'İşlem başarısız');return d}
$('sw').onclick=function(){mode=mode==='login'?'register':'login';$('at').textContent=mode==='login'?'Giriş Yap':'Hesap Oluştur';$('ab').textContent=mode==='login'?'Giriş Yap':'Hesap Oluştur';$('sw').textContent=mode==='login'?'Hesabınız yok mu? Ücretsiz oluşturun':'Zaten hesabınız var mı? Giriş yapın'}
$('auth').onsubmit=async function(e){e.preventDefault();try{var d=await api('/api/auth/'+mode,{method:'POST',body:JSON.stringify({email:$('email').value,password:$('pass').value})});show(d.user)}catch(x){$('ae').textContent=x.message}}
async function show(u){S.user=u;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('login').classList.add('hidden');await load()}
async function load(){try{var a=await Promise.all([api('/api/dashboard'),api('/api/jobs'),api('/api/proposals'),api('/api/notifications'),api('/api/settings')]);S.stats=a[0].stats;S.user=a[0].user;S.jobs=a[1].jobs;S.proposals=a[2].proposals;S.notifications=a[3].notifications;S.settings=a[4].settings;render()}catch(e){toast(e.message)}}
$('logout').onclick=async function(){await api('/api/auth/logout',{method:'POST'});location.reload()};$('refresh').onclick=load;
document.querySelectorAll('.nav[data-p]').forEach(function(b){b.onclick=function(){page=b.dataset.p;document.querySelectorAll('.nav').forEach(function(x){x.classList.remove('active')});b.classList.add('active');render()}})
function render(){var m={home:['Genel Bakış','MexAy iş akışınızın merkezi.'],jobs:['İşler','İlanları analiz et, kaydet ve teklif hazırla.'],proposals:['Teklifler','Taslakları incele ve durumlarını takip et.'],notifications:['Bildirimler','MexAy bildirimleri.'],settings:['Ayarlar','İş eşleştirme kriterleri.']};$('title').textContent=m[page][0];$('sub').textContent=m[page][1];window[page]()}
function home(){$('content').innerHTML='<div class="grid"><div class="card"><span class="muted">Plan</span><div class="value">'+esc(S.user.plan)+'</div></div><div class="card"><span class="muted">Tarama</span><div class="value">'+S.user.scans_used+' / '+S.stats.scan_limit+'</div></div><div class="card"><span class="muted">Kayıtlı İş</span><div class="value">'+S.stats.saved+'</div></div><div class="card"><span class="muted">Teklif</span><div class="value">'+S.stats.proposals+'</div></div></div><div class="card section"><h3>Hızlı Başlangıç</h3><button class="btn" onclick="demo()">Demo İşleri Tara</button> <button class="btn" onclick="go('jobs')">İşleri Gör</button><p class="muted">MexAy ilanları analiz eder, uygunluk kontrolü yapar ve teklif taslağı oluşturur. Gerçek gönderim kullanıcı onayına bağlıdır.</p></div>'}
function go(p){page=p;document.querySelectorAll('.nav').forEach(function(x){x.classList.toggle('active',x.dataset.p===p)});render()}
function jobs(){var h='<div class="card"><button class="btn" onclick="demo()">Demo İşleri Tara</button> <button class="btn" onclick="imp()">JSON İçe Aktar</button>';if(!S.jobs.length)h+='<p class="muted">Henüz iş yok.</p>';S.jobs.forEach(function(j){h+='<div class="row"><div><b>'+esc(j.title)+'</b><p class="muted">'+esc((j.description||'').slice(0,200))+'</p><span class="tag">'+esc(j.status)+'</span></div><div style="text-align:right"><div class="score">'+(j.score||0)+'/100</div><button class="btn" onclick="save('+j.id+')">'+(j.status==='saved'?'Kaldır':'Kaydet')+'</button> <button class="btn" onclick="proposal('+j.id+')">Teklif</button></div></div>'});$('content').innerHTML=h+'</div>'}
function proposals(){var h='<div class="card">';if(!S.proposals.length)h+='<p class="muted">Henüz teklif taslağı yok.</p>';S.proposals.forEach(function(p){h+='<div class="row"><div><b>'+esc(p.title)+'</b><p class="muted">'+esc(p.body.slice(0,240))+'...</p></div><select onchange="pstatus('+p.id+',this.value)"><option '+(p.status==='draft'?'selected':'')+'>draft</option><option '+(p.status==='review'?'selected':'')+'>review</option><option '+(p.status==='approved'?'selected':'')+'>approved</option><option '+(p.status==='submitted'?'selected':'')+'>submitted</option><option '+(p.status==='replied'?'selected':'')+'>replied</option><option '+(p.status==='won'?'selected':'')+'>won</option><option '+(p.status==='lost'?'selected':'')+'>lost</option></select></div>});$('content').innerHTML=h+'</div>'}
function notifications(){var h='<div class="card"><button class="btn" onclick="readAll()">Tümünü okundu işaretle</button>';S.notifications.forEach(function(n){h+='<div class="row"><div><b>'+esc(n.title)+'</b><p class="muted">'+esc(n.body)+'</p></div></div>'});$('content').innerHTML=h+'</div>'}
function settings(){var s=S.settings;$('content').innerHTML='<div class="card"><div class="field"><label>Minimum saatlik ücret</label><input id="mh" value="'+s.min_hourly+'"></div><div class="field"><label>Minimum sabit bütçe</label><input id="mf" value="'+s.min_fixed+'"></div><div class="field"><label>Anahtar kelimeler</label><textarea id="kw">'+esc(s.keywords.join(','))+'</textarea></div><div class="field"><label>Hariç kelimeler</label><textarea id="ex">'+esc(s.excludes.join(','))+'</textarea></div><button class="primary" onclick="saveSettings()">Ayarları Kaydet</button></div>'}
async function demo(){try{await api('/api/scan',{method:'POST',body:JSON.stringify({connects_balance:10,jobs:[{id:'demo-1',title:'Google Sheets & AI Automation Dashboard',description:'Build an automation workflow with Google Sheets, APIs and AI.',skills:['Google Sheets','Automation','API','AI'],hourly_rate_max:35,payment_verified:true,proposals_count:8,client_hires:4,can_apply:true,connects_cost:5,url:''}]})});toast('Tarama tamamlandı');await load();go('jobs')}catch(e){toast(e.message)}}
async function save(id){try{await api('/api/jobs/'+id+'/save',{method:'POST'});await load()}catch(e){toast(e.message)}}async function proposal(id){try{var d=await api('/api/proposals',{method:'POST',body:JSON.stringify({job_id:id})});openModal('Teklif Taslağı','<pre style="white-space:pre-wrap">'+esc(d.body)+'</pre>');await load()}catch(e){toast(e.message)}}async function pstatus(id,s){try{await api('/api/proposals/'+id,{method:'PATCH',body:JSON.stringify({status:s})});await load()}catch(e){toast(e.message)}}async function readAll(){await api('/api/notifications/read',{method:'POST'});await load()}async function saveSettings(){try{await api('/api/settings',{method:'PUT',body:JSON.stringify({min_hourly:$('mh').value,min_fixed:$('mf').value,keywords:$('kw').value.split(',').map(function(x){return x.trim()}).filter(Boolean),excludes:$('ex').value.split(',').map(function(x){return x.trim()}).filter(Boolean)})});toast('Ayarlar kaydedildi');await load()}catch(e){toast(e.message)}}function imp(){openModal('JSON İçe Aktar','<textarea id="json" style="width:100%;height:220px">[]</textarea><br><button class="primary" onclick="doImp()">İçe Aktar</button>')}async function doImp(){try{await api('/api/jobs/import',{method:'POST',body:JSON.stringify({jobs:JSON.parse($('json').value)})});closeModal();await load();go('jobs')}catch(e){toast(e.message)}}function openModal(t,b){$('mt').textContent=t;$('mb').innerHTML=b;$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');setTimeout(function(){$('toast').classList.add('hidden')},2500)}
(async function(){try{var d=await api('/api/me');if(d.authenticated)show(d.user)}catch(e){}})();
</script></body></html>
